
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#183b56">
</head>

<body>

    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your expenses and manage your budget effectively.</p>
    </header>

    <main>

        <section class="month-section">
            <label for="month">Select Month:</label>
            <input type="month" id="month" name="month">
        </section>

        <section class="summary">

            <div class="card">
                <h2>Total Income</h2>
                <p id="income">$0.00</p>
            </div>

            <div class="card">
                <h2>Total Expenses</h2>
                <p id="expenses">$0.00</p>
            </div>

            <div class="card">
                <h2>Balance</h2>
                <p id="balance">$0.00</p>
            </div>

        </section>

        <section class="card">
            <h2>Add a transaction</h2>

            <form id="transaction-form">

                <label for="description">Description:</label>
                <input type="text" id="description" required>

                <label for="amount">Amount:</label>
                <input
                    type="number"
                    id="amount"
                    min="0.01"
                    step="0.01"
                    placeholder="25.00"
                    required
                >

                <label for="type">Transaction Type:</label>

                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="submit">Add Transaction</button>

            </form>
        </section>

        <section class="card">
    <h2>Monthly Overview</h2>
    <canvas id="budget-chart"></canvas>
</section>

<section class="card">
    <h2>My Transactions</h2>
    <button type="button" id="export-button">
        Export to Excel
    </button>
    <ul id="transaction-list"></ul>
</section>

    </main>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("service-worker.js")
            .then(function() {
                console.log("App is ready!");
            })
            .catch(function(error) {
                console.log("Service Worker error:", error);
            });
    });
}
</script>

</body>
</html>
